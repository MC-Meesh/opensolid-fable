name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    name: build / test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # The fuzz package is its own workspace (see fuzz/README.md), so the
      # steps above do not reach it. Building the libFuzzer binaries needs
      # nightly and is handled by fuzz.yml; what runs here is the harness
      # library plus the corpus-replay regression gate, which are plain stable
      # Rust. This is what keeps every past fuzz finding fixed: a committed
      # crash artifact is re-run on every push.
      - name: Fuzz harness — format
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check

      - name: Fuzz harness — clippy
        run: >
          cargo clippy --manifest-path fuzz/Cargo.toml --no-default-features
          --all-targets -- -D warnings

      - name: Fuzz harness — corpus replay
        run: cargo test --manifest-path fuzz/Cargo.toml --no-default-features

  # The agent layer — MCP server, its published tarball, and the playground.
  # Until of-2y4.3 none of this was gated: `cargo test` never touches the JS, so
  # a kernel change could break every MCP tool and the playground build and CI
  # would stay green. It found exactly that on arrival — 14 of 55 MCP tests fail
  # against a stale pkg/, which is why every step here builds the wasm first
  # rather than trusting a checked-out one.
  agent-layer:
    name: mcp server / gallery / playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The official installer drops a prebuilt binary in ~10s. `cargo install
      # wasm-pack` builds it from source and costs minutes on every cache miss.
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      # --- MCP server -----------------------------------------------------
      # `npm run build` compiles crates/opensolid-wasm for the nodejs target
      # into tools/mcp-server/pkg. It is a prerequisite, not a separate check:
      # the tests import the kernel through it.
      - name: Build MCP wasm kernel
        working-directory: tools/mcp-server
        run: npm run build

      - name: MCP server tests
        working-directory: tools/mcp-server
        run: npm test

      # Packs a real tarball, unpacks it, and drives the unpacked server over
      # stdio. Guards the `npx opensolid-mcp` promise: a published package with
      # no wasm in it installs cleanly and only fails on the user's machine, and
      # npm versions are immutable once published.
      - name: Distribution smoke test (npm pack -> run)
        working-directory: tools/mcp-server
        run: node --test test/package.test.js

      # Every gallery transcript is regenerated by driving the real tool
      # handlers, so this is an end-to-end run of the whole agent surface —
      # scripts, meshing, renders, mass properties, STEP/STL/OBJ export. It
      # exits non-zero if any example fails.
      #
      # Deliberately not gated on the transcripts being diff-clean afterwards:
      # they embed exported byte counts, so any legitimate change to the STEP
      # writer rewrites them and a diff gate would sit permanently red.
      - name: Agent gallery build
        working-directory: tools/mcp-server
        run: npm run gallery

      # --- Playground -----------------------------------------------------
      - name: Playground deps
        working-directory: web/playground
        run: npm ci

      - name: Build playground wasm kernel
        working-directory: web/playground
        run: npm run wasm

      - name: Playground tests
        working-directory: web/playground
        run: npm test

      # The same build Pages deploys (.github/workflows/pages.yml). Gating it
      # here means a broken playground fails the PR rather than the deploy.
      - name: Playground build
        working-directory: web/playground
        run: npm run build
